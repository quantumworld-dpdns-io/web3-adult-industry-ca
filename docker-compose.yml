version: "3.9"

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  ca-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  jaeger-data:

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ca-api:latest
    container_name: ca-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://ca:${DB_PASSWORD:-changeme}@postgres:5432/ca
      - REDIS_URL=redis://redis:6379/0
      - OTLP_ENDPOINT=http://otel-collector:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - ca-network

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: ca-dashboard:latest
    container_name: ca-dashboard
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - ca-network

  redis:
    image: redis:7-alpine
    container_name: ca-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    networks:
      - ca-network

  postgres:
    image: postgres:16-alpine
    container_name: ca-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=ca
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
      - POSTGRES_DB=ca
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ca -d ca"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    networks:
      - ca-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: ca-otel-collector
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    command: ["--config=/etc/otel-collector-config.yaml"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:13133"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *default-logging
    networks:
      - ca-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ca-jaeger
    ports:
      - "16686:16686"
      - "14250:14250"
      - "14269:14269"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - LOG_LEVEL=info
    volumes:
      - jaeger-data:/tmp
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:16686"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *default-logging
    networks:
      - ca-network

  zap:
    image: softwaresecurityproject/zap-stable:latest
    container_name: ca-zap
    profiles:
      - security-scan
    ports:
      - "8080:8080"
    command: ["zap.sh", "-daemon", "-host", "0.0.0.0", "-port", "8080", "-config", "api.addrs.addr.name=.*", "-config", "api.addrs.addr.regex=true"]
    healthcheck:
      test: ["CMD", "zap-cli", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    networks:
      - ca-network

  nessie:
    image: projectnessie/nessie:latest
    container_name: ca-nessie
    profiles:
      - iceberg
    ports:
      - "19120:19120"
    environment:
      - NESSIE_VERSION_STORE_TYPE=IN_MEMORY
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:19120/api/v1/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    logging: *default-logging
    networks:
      - ca-network
