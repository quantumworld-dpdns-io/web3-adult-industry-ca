name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: "3.11"

jobs:
  rust-build-and-test:
    name: Rust - Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check
        continue-on-error: true

      - name: Clippy
        run: cargo clippy -- -D warnings
        continue-on-error: true

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

  python-lint-and-check:
    name: Python - Lint & Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f ca-api/requirements.txt ]; then pip install -r ca-api/requirements.txt; fi

      - name: Lint with flake8
        run: flake8 ca-api/ --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

      - name: Python syntax check
        run: |
          find ca-api/ -name "*.py" -exec python -m py_compile {} \;

  robot-framework-functional:
    name: Robot Framework - Functional Tests
    runs-on: ubuntu-latest
    services:
      api:
        image: python:3.11-slim
        ports:
          - 8000:8000
        options: >-
          --name ca-api-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Robot Framework
        run: |
          pip install robotframework robotframework-requests

      - name: Run Robot Framework functional tests
        run: |
          mkdir -p tests/robot/results
          robot --variable API_URL:http://localhost:8000 \
            --outputdir tests/robot/results \
            tests/robot/functional/
        continue-on-error: true

      - name: Upload Robot Framework results
        uses: actions/upload-artifact@v4
        with:
          name: robot-framework-functional-results
          path: tests/robot/results/
        if: always()

  smart-contract-validation:
    name: Smart Contracts - Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Solana contract structure
        run: |
          echo "=== Solana Contract Structure ==="
          ls -la contracts/solana/
          if [ -f contracts/solana/Cargo.toml ]; then
            echo "Solana project detected"
          fi
          if [ -f contracts/solana/Xargo.toml ]; then
            echo "Solana BPF configuration found"
          fi

      - name: Validate EVM contract structure
        run: |
          echo "=== EVM Contract Structure ==="
          ls -la contracts/evm/
          if [ -f contracts/evm/hardhat.config.ts ] || [ -f contracts/evm/hardhat.config.js ]; then
            echo "Hardhat project detected"
          fi
          if [ -f contracts/evm/truffle-config.js ]; then
            echo "Truffle project detected"
          fi

      - name: Check for required contract directories
        run: |
          for dir in contracts/solana contracts/evm; do
            if [ ! -d "$dir" ]; then
              echo "WARNING: $dir does not exist"
              exit 1
            fi
          done
          echo "All required contract directories exist"
