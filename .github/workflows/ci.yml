name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: '3.11'

jobs:
  rust-build-test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-results
          path: target/debug/*.d

  python-lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Run flake8
        run: flake8 ca-api/ --count --statistics --show-source
      - name: Python compile check
        run: |
          find ca-api/ -name '*.py' -exec python -m py_compile {} \;
      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-lint-results
          path: /tmp/python-lint-report.txt
        continue-on-error: true

  behave-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install behave and deps
        run: |
          pip install behave requests
          if [ -f ca-api/requirements.txt ]; then pip install -r ca-api/requirements.txt; fi
      - name: Run behave tests
        run: behave tests/behave/features/ --junit --junit-directory behave-results
      - name: Upload behave results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behave-test-results
          path: behave-results/

  playwright-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci || npm install
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test tests/playwright/ --reporter html
      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: playwright-report/

  karate-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Maven deps
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Run Karate tests
        run: |
          if [ -f tests/karate/pom.xml ]; then
            mvn test -f tests/karate/pom.xml -Dkarate.options="--output=karate-results"
          else
            echo "No Karate pom.xml found, skipping"
          fi
      - name: Upload Karate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-test-results
          path: karate-results/

  appium-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2
      - name: Install dependencies
        run: npm ci || npm install
      - name: Run Appium tests
        run: npx appium --log-level info &
          sleep 5
          npx mocha tests/appium/ --reporter json --reporter-option output=appium-results.json || true
      - name: Upload Appium results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-results
          path: appium-results.json
