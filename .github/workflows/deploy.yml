name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options:
          - staging
          - production
        default: staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:latest

      - name: Build and push Dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dashboard
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-dashboard:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-dashboard:latest

      - name: Build and push Rust CLI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.rust-builder
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cli:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cli:latest

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment:
      name: staging
      url: https://staging.ca.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key

      - name: Deploy via Docker Compose
        run: |
          ssh -i ~/.ssh/staging_key -o StrictHostKeyChecking=no \
            "${{ secrets.STAGING_HOST }}" \
            "cd /opt/ca && \
             docker compose pull && \
             docker compose up -d --remove-orphans"

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/staging_key -o StrictHostKeyChecking=no \
            "${{ secrets.STAGING_HOST }}" \
            "curl -sf http://localhost:8000/health || exit 1"

  robot-smoke-tests:
    name: Robot Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Robot Framework
        run: pip install robotframework robotframework-requests

      - name: Run smoke tests against staging
        run: |
          mkdir -p results/smoke
          robot --variable API_URL:${{ secrets.STAGING_API_URL }} \
            --outputdir results/smoke \
            --include smoke \
            tests/robot/functional/
        continue-on-error: true

      - name: Upload smoke test results
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: results/smoke/
        if: always()

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [robot-smoke-tests]
    environment:
      name: production
      url: https://ca.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH for production
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key

      - name: Blue-green deploy to production
        run: |
          ssh -i ~/.ssh/prod_key -o StrictHostKeyChecking=no \
            "${{ secrets.PROD_HOST }}" \
            "cd /opt/ca && \
             docker compose -f docker-compose.yml -f docker-compose.prod.yml pull && \
             docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans --scale api-blue=1 --scale api-green=0 && \
             sleep 30 && \
             curl -sf http://localhost:8000/health && \
             docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans --scale api-blue=0 --scale api-green=1"

      - name: Verify production deployment
        run: |
          sleep 15
          curl -sf https://ca.example.com/health || exit 1
