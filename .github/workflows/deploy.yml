name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options:
          - staging
          - production
        default: staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api:latest

      - name: Build and push Dashboard image
        uses: docker/build-push-action@v6
        with:
          context: ./ca-dashboard
          file: Dockerfile.dashboard
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-dashboard:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-dashboard:latest

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment:
      name: staging
      url: https://staging.ca.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key

      - name: Deploy via Docker Compose
        run: |
          ssh -i ~/.ssh/staging_key -o StrictHostKeyChecking=no \
            user@staging-server "cd /opt/ca && \
            docker compose pull && \
            docker compose up -d --remove-orphans"

      - name: Smoke test
        run: |
          sleep 15
          curl -f http://localhost:8000/health || exit 1

  robot-smoke-tests:
    name: Robot Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    steps:
      - uses: actions/checkout@v4

      - name: Run smoke tests
        run: |
          pip install robotframework robotframework-restinstance
          robot --variable API_URL:${{ secrets.STAGING_API_URL }} \
            --outputdir results/smoke \
            --include smoke \
            tests/robot/functional/

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [robot-smoke-tests]
    if: github.event.inputs.environment == 'production' || github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://ca.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Production deploy
        run: |
          echo "Production deployment would happen here"
          echo "Blue-green deployment to production cluster"
