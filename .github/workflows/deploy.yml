name: Deploy Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_ORG: ${{ github.repository_owner }}

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_ORG }}/ca-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push Dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dashboard
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_ORG }}/ca-dashboard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push Rust builder image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.rust-builder
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_ORG }}/ca-cli:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build-images
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/ca-deploy
            docker compose pull
            docker compose up -d --remove-orphans
            docker system prune -f

  smoke-tests:
    needs: deploy-staging
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install behave
        run: pip install behave requests
      - name: Run smoke tests
        run: behave tests/behave/features/ --tags=smoke --junit --junit-directory smoke-results
      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: smoke-results/

  deploy-prod:
    needs: smoke-tests
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency: production-deploy
    steps:
      - uses: actions/checkout@v4
      - name: Blue-green deploy to production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            ACTIVE=$(docker ps --format '{{.Names}}' | grep -E '^ca-(blue|green)$' | head -1)
            if echo "$ACTIVE" | grep -q blue; then
              NEW="green"
              OLD="blue"
            else
              NEW="blue"
              OLD="green"
            fi
            docker compose -f docker-compose.prod.yml up -d ca-$NEW
            sleep 30
            curl -sf http://localhost:8000/health && \
              docker compose -f docker-compose.prod.yml stop ca-$OLD || \
              docker compose -f docker-compose.prod.yml logs ca-$NEW
