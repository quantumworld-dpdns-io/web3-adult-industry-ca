name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.11'

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run cargo-audit
        run: cargo audit || true
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        run: |
          if [ -f ca-api/requirements.txt ]; then
            pip-audit -r ca-api/requirements.txt || true
          fi
      - name: Run npm audit
        run: npm audit --audit-level=high || true
      - name: Upload dependency scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan-results
          path: /tmp/dep-scan-report.txt

  semgrep-sast:
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: returntocorp/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep with OWASP Top 10 rules
        run: |
          semgrep --config=p/owasp-top-ten \
            --error \
            --output=semgrep-results.sarif \
            --sarif \
            . || true
      - name: Upload Semgrep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.sarif

  karate-owasp:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run Karate OWASP Top 10 features
        run: |
          if [ -f tests/karate-security/pom.xml ]; then
            mvn test -f tests/karate-security/pom.xml \
              -Dkarate.options="--output=karate-owasp-results"
          else
            echo "No Karate security pom.xml found, skipping"
          fi
      - name: Upload Karate OWASP results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-owasp-results
          path: karate-owasp-results/

  zap-dast:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run OWASP ZAP full scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: ${{ vars.ZAP_TARGET_URL || 'https://example.com' }}
          rules_file_name: .zap/rules.tsv
          cmd_options: '-a -j -J zap-results.json'
          allow_issue_writing: false
      - name: Upload ZAP results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-results
          path: zap-results.json
