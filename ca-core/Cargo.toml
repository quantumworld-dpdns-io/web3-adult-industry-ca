[package]
name = "ca-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
ed25519-dalek = "2"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
liboqs = { version = "0.10", optional = true }

[features]
default = []
pqc = ["liboqs"]
