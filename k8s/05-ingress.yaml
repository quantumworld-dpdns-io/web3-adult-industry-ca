apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ca-ingress
  namespace: ca-system
  labels:
    app: ca
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.ca.example.com
        - dashboard.ca.example.com
      secretName: ca-tls
  rules:
    - host: api.ca.example.com
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ca-api-service
                port:
                  number: 8000
    - host: dashboard.ca.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ca-dashboard-service
                port:
                  number: 3000
