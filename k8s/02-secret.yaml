apiVersion: v1
kind: Secret
metadata:
  name: ca-secrets
  namespace: ca-system
  labels:
    app: ca
type: Opaque
stringData:
  # Replace with actual secrets in production
  API_KEY: "change-me-api-key"
  JWT_SECRET: "change-me-jwt-secret"
  POSTGRES_PASSWORD: "change-me-password"
  # Smart contract keys (store in external secrets manager in production)
  EVM_PRIVATE_KEY: ""
  SOLANA_PRIVATE_KEY: ""
  # Dashboard config
  NEXT_PUBLIC_API_KEY: ""
