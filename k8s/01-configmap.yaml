apiVersion: v1
kind: ConfigMap
metadata:
  name: ca-config
  namespace: ca-system
  labels:
    app.kubernetes.io/part-of: web3-adult-industry-ca
data:
  API_URL: "https://api.ca-system.svc.cluster.local:8000"
  LOG_LEVEL: "info"
  CORS_ORIGINS: "https://dashboard.ca-system.svc.cluster.local"
  RATE_LIMIT: "100/minute"
  OTLP_ENDPOINT: "http://otel-collector.ca-system.svc.cluster.local:4318"
  REDIS_URL: "redis://redis.ca-system.svc.cluster.local:6379/0"
  DATABASE_URL: "postgresql://ca:$(DB_PASSWORD)@postgres.ca-system.svc.cluster.local:5432/ca"
  PYTHONUNBUFFERED: "1"
  ENVIRONMENT: "production"
