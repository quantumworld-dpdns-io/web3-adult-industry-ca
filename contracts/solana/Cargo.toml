[package]
name = "ca-solana"
version = "0.1.0"
edition = "2021"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"

[lib]
name = "ca_solana"
crate-type = ["lib", "cdylib", "staticlib"]

[profile.release]
opt-level = "z"
lto = true
debug = false
overflow-checks = true
